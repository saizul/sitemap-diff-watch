name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds, then runs `node --test dist/test/*.test.js` (files listed explicitly, because
      # Node 22+ treats a directory argument as a glob pattern).
      - run: npm test
      - name: CLI and example smoke test
        run: |
          node dist/src/cli.js --version
          node dist/src/cli.js parse test/fixtures/extensions.xml
          node dist/src/cli.js parse test/fixtures/sitemap-index.xml --urls
          node examples/library-usage.mjs
          node -e "const m = require('./dist/cjs/index.js'); if (typeof m.crawlSitemaps !== 'function') process.exit(1)"
      - name: Package contents
        run: npm pack --dry-run
